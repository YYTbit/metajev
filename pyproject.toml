[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metajev"
version = "0.1.0"
description = "Cache the decision, compute the policy. A policy-free decision store for Jev-class System One models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YYTbit" }]
keywords = [
    "jev",
    "system-one",
    "decision-model",
    "typed-decisions",
    "calibration",
    "policy",
    "routing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
metajev = "metajev.cli:main"

[project.urls]
Homepage = "https://github.com/YYTbit/metajev"
Issues = "https://github.com/YYTbit/metajev/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/metajev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
